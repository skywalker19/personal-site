name: Check personal-site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check sensitive data in repository
        run: npm run check:sensitive
        env:
          PROTECTED_USERNAMES: ${{ secrets.PROTECTED_USERNAMES }}
      - name: Validate and build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Check sensitive data in generated site
        run: npm run check:sensitive -- --path dist
        env:
          PROTECTED_USERNAMES: ${{ secrets.PROTECTED_USERNAMES }}
